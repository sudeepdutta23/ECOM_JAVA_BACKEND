# Test profile, activated with @ActiveProfiles("test").
# Datasource properties are injected by Testcontainers (@ServiceConnection),
# so placeholders here only satisfy property resolution.
spring:
  datasource:
    url: jdbc:postgresql://unused:5432/unused
    username: unused
    password: unused
  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: http://localhost:3000
  # Every integration test calls from 127.0.0.1 and shares one context, so limits would make them
  # fail each other. RateLimitIT switches it back on in its own context.
  rate-limit:
    enabled: false
  security:
    jwt:
      allow-ephemeral-key: true

logging:
  level:
    root: WARN
    com.ecommerce.backend: INFO
    org.flywaydb: INFO
