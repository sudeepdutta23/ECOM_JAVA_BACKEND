# Production profile.
# Every secret MUST come from the environment or a secret manager. There are no defaults,
# so the application refuses to start if DB_HOST, DB_PASSWORD, etc. are missing.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}

  # Real SMTP provider. TLS is required so credentials and links never travel in clear text.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  # Tomcat reads X-Forwarded-For from the right and stops at the first address that is not a trusted proxy,
  # so a value the client sent cannot become its address (rate limits, audit log, sessions). "framework" takes
  # the leftmost value, which the client controls: never use it here.
  # Trusted: private ranges by default; if the load balancer has a public address, set
  # SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES. Only the load balancer may reach this port.
  forward-headers-strategy: native

# The actuator (probes, metrics) on its own port, which the load balancer must never publish.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}

app:
  # Required: which payment provider charges customers. Only "simulated" exists so far (Phase 6);
  # a staging environment may set it explicitly. Without it no PaymentGateway exists and startup fails.
  payment:
    provider: ${PAYMENT_PROVIDER}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  structured:
    format:
      console: ecs                      # JSON logs for log aggregators (ELK, Loki, Datadog)
  level:
    com.ecommerce.backend: INFO
