# Production profile.
# Every secret MUST come from the environment or a secret manager. There are no defaults,
# so the application refuses to start if DB_HOST, DB_PASSWORD, etc. are missing.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}

server:
  forward-headers-strategy: framework   # trust X-Forwarded-* from the load balancer for HTTPS detection

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  structured:
    format:
      console: ecs                      # JSON logs for log aggregators (ELK, Loki, Datadog)
  level:
    com.ecommerce.backend: INFO
