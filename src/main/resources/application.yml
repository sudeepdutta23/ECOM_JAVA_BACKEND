# =====================================================================
# Shared configuration for ALL environments.
# Profile files (application-{profile}.yml) override values below.
# Secrets are NEVER written here; they arrive through environment variables.
# =====================================================================
spring:
  application:
    name: ecommerce-backend

  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ecommerce-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000      # ms to wait for a free connection before failing
      idle-timeout: 300000          # 5 min
      max-lifetime: 1800000         # 30 min, below typical DB/firewall idle cutoffs

  jpa:
    open-in-view: false             # no lazy loading from controllers; forces explicit fetch plans
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true            # `flyway clean` drops everything; never allow it by default

  # SMTP settings shared by every profile. A JavaMailSender (and real sending) only exists when
  # spring.mail.host is set: dev points it at Mailpit, prod at a real provider.
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000   # ms; never let a slow mail server hang a thread
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # Thread pool for @Async work (emails). Bounded queue so a mail outage cannot exhaust memory.
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 10s

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true   # reject unexpected JSON fields (mass-assignment defence)

  # spring.mvc.problemdetails.enabled stays false: GlobalExceptionHandler already produces
  # RFC 9457 responses, and enabling it registers a competing handler.

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful                # finish in-flight requests on SIGTERM
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true               # /actuator/health/liveness and /readiness
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true

app:
  # Browser origins allowed to call the API (comma-separated). Empty = no cross-origin access.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # Per-client-IP limits on sensitive endpoints (token bucket). First matching rule applies.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-tracked-clients: 100000
    rules:
      - name: login                       # password guessing and credential stuffing
        method: POST
        paths: [/api/v1/auth/login]
        capacity: 10
        period: 1m
      - name: email-sending               # each call can send an email: stop inbox flooding
        method: POST
        paths: [/api/v1/auth/register, /api/v1/auth/email/resend-verification, /api/v1/auth/password/forgot]
        capacity: 5
        period: 15m
      - name: credential-actions          # token redemption and password re-confirmation
        method: POST
        paths: [/api/v1/auth/refresh, /api/v1/auth/email/verify, /api/v1/auth/password/reset,
                /api/v1/auth/password/change, /api/v1/auth/me/deactivate]
        capacity: 30
        period: 1m

  auth:
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
    email-verification-ttl: 24h
    refresh-token-ttl: 7d
    max-failed-logins: 5
    lockout-duration: 15m
    password-reset-ttl: 30m
    # Above the slowest normal failure path (hash + counter write, ~250 ms measured locally).
    failed-login-min-duration: 400ms
    # Secure cookies are only sent over HTTPS. Dev overrides this so curl works over plain HTTP.
    refresh-cookie-secure: true
  mail:
    from: ${MAIL_FROM:Ecommerce <no-reply@ecommerce.local>}
  security:
    jwt:
      issuer: ${JWT_ISSUER:ecommerce-backend}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      clock-skew: 30s
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      key-id: ${JWT_KEY_ID:}
      allow-ephemeral-key: false     # only dev and test may generate a throwaway key

info:
  app:
    name: ${spring.application.name}
    description: Enterprise e-commerce backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

logging:
  pattern:
    # Every log line carries the request ID put into the MDC by RequestIdFilter
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
  level:
    root: INFO
    com.ecommerce.backend: INFO
