# =====================================================================
# Shared configuration for ALL environments.
# Profile files (application-{profile}.yml) override values below.
# Secrets are NEVER written here; they arrive through environment variables.
# =====================================================================
spring:
  application:
    name: ecommerce-backend

  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ecommerce-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000      # ms to wait for a free connection before failing
      idle-timeout: 300000          # 5 min
      max-lifetime: 1800000         # 30 min, below typical DB/firewall idle cutoffs

  jpa:
    open-in-view: false             # no lazy loading from controllers; forces explicit fetch plans
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true            # `flyway clean` drops everything; never allow it by default

  # SMTP settings shared by every profile. A JavaMailSender (and real sending) only exists when
  # spring.mail.host is set: dev points it at Mailpit, prod at a real provider.
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000   # ms; never let a slow mail server hang a thread
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # Thread pool for @Async work (emails). Bounded queue so a mail outage cannot exhaust memory.
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 10s

  # Redis (Phase 11): shared rate limits and the read cache. Optional at runtime: when it is down,
  # requests are not rate limited and reads go to the database (both logged), the site stays up.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  # Uploads (Phase 8): rejected with 413 before a handler sees them. Images are re-encoded anyway,
  # so 5 MB is plenty for a product photo.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true   # reject unexpected JSON fields (mass-assignment defence)

  # spring.mvc.problemdetails.enabled stays false: GlobalExceptionHandler already produces
  # RFC 9457 responses, and enabling it registers a competing handler.

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful                # finish in-flight requests on SIGTERM
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    encoding:
      charset: UTF-8
      # Requests only: a forced response charset would turn image/png into "image/png;charset=UTF-8".
      # JSON is UTF-8 by definition (RFC 8259) and Jackson writes UTF-8.
      force-request: true
  tomcat:
    # Read and discard the rest of an upload above the multipart limit (6 MB), so the client
    # receives the 413 instead of a connection reset.
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true               # /actuator/health/liveness and /readiness
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true

app:
  # Browser origins allowed to call the API (comma-separated). Empty = no cross-origin access.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # Per-client-IP limits on sensitive endpoints (token bucket). First matching rule applies.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # redis: one bucket per client shared by every server; local: per server (a single instance only).
    store: ${RATE_LIMIT_STORE:redis}
    max-tracked-clients: 100000
    rules:
      - name: login                       # password guessing and credential stuffing
        method: POST
        paths: [/api/v1/auth/login]
        capacity: 10
        period: 1m
      - name: email-sending               # each call can send an email: stop inbox flooding
        method: POST
        paths: [/api/v1/auth/register, /api/v1/auth/email/resend-verification, /api/v1/auth/password/forgot]
        capacity: 5
        period: 15m
      - name: credential-actions          # token redemption and password re-confirmation
        method: POST
        paths: [/api/v1/auth/refresh, /api/v1/auth/email/verify, /api/v1/auth/password/reset,
                /api/v1/auth/password/change, /api/v1/auth/me/deactivate,
                /api/v1/auth/me/erase, /api/v1/organizations/invitations/accept]
        capacity: 30
        period: 1m
      - name: checkout                    # each call locks stock and sellers: bound what one client can hold
        method: POST
        paths: [/api/v1/checkout]
        capacity: 20
        period: 1m
      - name: data-export                 # reads every module for one person: cheap to ask, costly to serve
        method: GET
        paths: [/api/v1/auth/me/export]
        capacity: 5
        period: 15m

  auth:
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
    email-verification-ttl: 24h
    refresh-token-ttl: 7d
    max-failed-logins: 5
    lockout-duration: 15m
    password-reset-ttl: 30m
    # Above the slowest normal failure path (hash + counter write, ~250 ms measured locally).
    failed-login-min-duration: 400ms
    # Secure cookies are only sent over HTTPS. Dev overrides this so curl works over plain HTTP.
    refresh-cookie-secure: true
  org:
    # Organisations one account may own that are not closed: limits spam sellers. Pending ones count.
    max-owned-organizations: 3
    max-pending-invitations: 50
    invitation-ttl: 7d
    frontend-base-url: ${app.auth.frontend-base-url}

  catalog:
    # The one platform currency (ISO 4217, two decimal places). Every price is in it.
    currency: ${CATALOG_CURRENCY:EUR}

  cache:
    # Read cache in Redis for the category list and product pages (JsonCache). false: always the database.
    enabled: ${CACHE_ENABLED:true}

  files:
    # Where uploaded files live. "local" writes below local-dir (dev, test, a single server);
    # a production cluster needs shared storage such as S3 behind the same FileStorage port.
    storage: local
    local-dir: ${FILES_LOCAL_DIR:${java.io.tmpdir}/ecommerce-files}
    # Images per product: bounds storage per seller and the storefront response.
    max-images-per-product: 8

  notification:
    # Email links point here; each notification carries a path inside the app.
    frontend-base-url: ${app.auth.frontend-base-url}

  order:
    # Different products per cart: bounds the cart view (no paging) and the size of one checkout.
    max-cart-lines: 50
    # Unpaid orders are cancelled after this, and their stock goes back on sale (Phase 12).
    payment-timeout: 30m

  # Background jobs (Phase 12). Each runs on one server at a time (ShedLock); false stops them all.
  jobs:
    enabled: ${JOBS_ENABLED:true}
    unpaid-orders-interval: PT1M
    cleanup-interval: PT1H
    # Notifications older than this are deleted.
    notification-retention: 90d

  profile:
    # Saved addresses per account: enough for any household; bounds the list (no paging).
    max-addresses: 20

  rbac:
    # First administrator: this account gets ADMIN at startup while no active admin exists.
    # Register and verify it first, then restart. Does nothing once an admin exists.
    bootstrap-admin-email: ${APP_RBAC_BOOTSTRAP_ADMIN_EMAIL:}
  mail:
    from: ${MAIL_FROM:Ecommerce <no-reply@ecommerce.local>}
    outbox:
      poll-interval: PT10S   # retries and crash recovery; new emails are sent right after commit
  security:
    jwt:
      issuer: ${JWT_ISSUER:ecommerce-backend}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      clock-skew: 30s
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      key-id: ${JWT_KEY_ID:}
      allow-ephemeral-key: false     # only dev and test may generate a throwaway key

info:
  app:
    name: ${spring.application.name}
    description: Enterprise e-commerce backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

logging:
  pattern:
    # Every log line carries the request ID put into the MDC by RequestIdFilter
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
  level:
    root: INFO
    com.ecommerce.backend: INFO
