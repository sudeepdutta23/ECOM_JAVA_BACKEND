# Local development profile.
# Reads the git-ignored .env file in the project root, the same file Docker Compose uses.
spring:
  config:
    import: optional:file:.env[.properties]

  jpa:
    properties:
      hibernate:
        format_sql: true

  # Mailpit from docker-compose.yml. Read emails at http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173   # typical React / Vite dev servers
  auth:
    refresh-cookie-secure: false   # local HTTP only; production keeps the default true
  security:
    jwt:
      # Set JWT_PRIVATE_KEY_LOCATION (e.g. file:keys/jwt-private.pem) to keep tokens across restarts.
      allow-ephemeral-key: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ecommerce.backend: DEBUG
    org.flywaydb: INFO
    # Uncomment to see SQL and bound parameters while debugging:
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
