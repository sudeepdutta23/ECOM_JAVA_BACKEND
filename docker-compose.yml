# Local development infrastructure only. The application itself runs from your IDE or Maven.
# Values come from the .env file next to this file (copy .env.example to .env first).
services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only, so the database is not reachable from your network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server with a web inbox. Every email the app sends lands here; nothing leaves your machine.
  # Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"   # SMTP
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"   # web UI

  # Shared rate limits and the read cache (Phase 11). Nothing in it is a source of truth, so no
  # persistence: a restart empties it and the application refills it.
  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
